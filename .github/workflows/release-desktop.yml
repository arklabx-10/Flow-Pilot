name: FlowPilot Windows Desktop Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-windows-desktop:
    name: Build Windows Installer (.msi / .exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/desktop/src-tauri -> target'

      - name: Install dependencies and build contracts + frontend
        run: |
          npm ci
          npm run build

      - name: Run Rust unit tests
        working-directory: apps/desktop/src-tauri
        run: cargo test

      - name: Build Tauri 2 Windows bundle
        run: npm --workspace=@flowpilot/desktop run tauri:build

      - name: Upload Windows Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flowpilot-windows-x64-installers
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
