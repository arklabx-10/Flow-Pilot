openapi: 3.1.0
info:
  title: FlowPilot API
  version: 1.0.0
  summary: Shared backend API for FlowPilot desktop and web companion clients.
  description: >
    Explicit, versioned HTTP contract for FlowPilot account authentication,
    devices, shared history synchronization (transcripts & notes with optimistic
    version concurrency), prompt templates, processing preferences, cloud speech
    transcription proxy, and health probes.
  contact:
    name: FlowPilot Architecture Team
servers:
  - url: http://localhost:5080
    description: Local development server
tags:
  - name: Health
    description: Service health and readiness probes
  - name: Auth
    description: User registration, login, logout, and session profile
  - name: Devices
    description: Client device registration and inventory
  - name: Transcripts
    description: Versioned, paginated, searchable transcripts with conflict detection
  - name: Notes
    description: Versioned, paginated, searchable notes with conflict detection
  - name: Templates
    description: Custom refinement prompt templates
  - name: Preferences
    description: User processing and synchronization preferences
  - name: Speech
    description: Cloud speech recognition and text refinement endpoints
  - name: Sync
    description: Optional user-authorized transcript synchronization
paths:
  /health:
    get:
      operationId: getHealthProbe
      tags: [Health]
      summary: Infrastructure health probe
      responses:
        '200':
          description: Service is healthy and ready to accept requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatusResponseV1'
  /api/v1/health:
    get:
      operationId: getHealthV1
      tags: [Health]
      summary: Versioned v1 health and storage readiness status
      responses:
        '200':
          description: Versioned health response payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatusResponseV1'
  /api/v1/auth/register:
    post:
      operationId: registerUserV1
      tags: [Auth]
      summary: Register a new FlowPilot user account
      responses:
        '200':
          description: Account registered and session issued.
  /api/v1/auth/login:
    post:
      operationId: loginUserV1
      tags: [Auth]
      summary: Authenticate user and issue Bearer session token
      responses:
        '200':
          description: Session issued.
  /api/v1/auth/logout:
    post:
      operationId: logoutUserV1
      tags: [Auth]
      summary: Revoke current Bearer session token
      responses:
        '200':
          description: Logged out.
  /api/v1/auth/me:
    get:
      operationId: getCurrentUserV1
      tags: [Auth]
      summary: Return authenticated user profile
      responses:
        '200':
          description: Authenticated user profile.
  /api/v1/devices:
    get:
      operationId: listDevicesV1
      tags: [Devices]
      summary: List user devices
      responses:
        '200':
          description: List of registered user devices.
    post:
      operationId: registerDeviceV1
      tags: [Devices]
      summary: Register or update a client device
      responses:
        '200':
          description: Registered device record.
  /api/v1/transcripts:
    get:
      operationId: listTranscriptsV1
      tags: [Transcripts]
      summary: Paginated, server-side searchable transcript history
      responses:
        '200':
          description: Paginated transcript list.
  /api/v1/transcripts/{id}:
    put:
      operationId: upsertTranscriptV1
      tags: [Transcripts]
      summary: Idempotent, version-checked transcript create or update
      responses:
        '200':
          description: Upserted transcript record.
        '409':
          description: Optimistic concurrency version conflict detected.
    delete:
      operationId: deleteTranscriptV1
      tags: [Transcripts]
      summary: Soft delete (tombstone for sync) or permanent purge (?permanent=true)
      responses:
        '200':
          description: Deleted.
  /api/v1/notes:
    get:
      operationId: listNotesV1
      tags: [Notes]
      summary: Paginated, server-side searchable saved notes
      responses:
        '200':
          description: Paginated note list.
  /api/v1/notes/{id}:
    put:
      operationId: upsertNoteV1
      tags: [Notes]
      summary: Idempotent, version-checked note create or update
      responses:
        '200':
          description: Upserted note record.
        '409':
          description: Optimistic concurrency version conflict detected.
    delete:
      operationId: deleteNoteV1
      tags: [Notes]
      summary: Soft delete or permanent purge (?permanent=true)
      responses:
        '200':
          description: Deleted.
  /api/v1/prompt-templates:
    get:
      operationId: listPromptTemplatesV1
      tags: [Templates]
      summary: List user prompt templates
      responses:
        '200':
          description: Prompt templates list.
  /api/v1/prompt-templates/{id}:
    put:
      operationId: upsertPromptTemplateV1
      tags: [Templates]
      summary: Create or update a prompt template
      responses:
        '200':
          description: Upserted prompt template.
    delete:
      operationId: deletePromptTemplateV1
      tags: [Templates]
      summary: Delete a prompt template
      responses:
        '200':
          description: Deleted.
  /api/v1/preferences:
    get:
      operationId: getPreferencesV1
      tags: [Preferences]
      summary: Get user processing and sync preferences
      responses:
        '200':
          description: User processing preferences.
    put:
      operationId: updatePreferencesV1
      tags: [Preferences]
      summary: Update user processing and sync preferences
      responses:
        '200':
          description: Updated preferences.
  /api/v1/speech/transcribe:
    post:
      operationId: transcribeSpeechV1
      tags: [Speech]
      summary: Transcribe captured audio via configured cloud speech provider
      responses:
        '200':
          description: Successful cloud transcription response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudTranscriptionResponseV1'
  /api/v1/text/refine:
    post:
      operationId: refineTextV1
      tags: [Speech]
      summary: Refine raw transcript using cloud text refinement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudTextRefineRequestV1'
      responses:
        '200':
          description: Refined text response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudTextRefineResponseV1'
  /api/v1/transcripts/sync:
    post:
      operationId: syncTranscriptV1
      tags: [Sync]
      summary: Synchronize a user-approved transcript entry to the cloud
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranscriptSyncRequestV1'
      responses:
        '200':
          description: Transcript synchronized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptSyncResponseV1'
  /api/v1/vocabulary:
    get:
      operationId: listVocabularyV1
      summary: List custom vocabulary / spoken-to-written replacements for the authenticated user
      tags: [Vocabulary]
      responses:
        '200':
          description: Custom vocabulary list.
  /api/v1/vocabulary/{id}:
    put:
      operationId: upsertVocabularyV1
      summary: Create or update a custom vocabulary entry
      tags: [Vocabulary]
      responses:
        '200':
          description: Vocabulary entry saved.
    delete:
      operationId: deleteVocabularyV1
      summary: Delete a custom vocabulary entry
      tags: [Vocabulary]
      responses:
        '200':
          description: Vocabulary entry deleted.
  /api/v1/telemetry/summary:
    get:
      operationId: getUsageTelemetrySummaryV1
      summary: Get dictation productivity and usage telemetry summary for the authenticated user
      tags: [Telemetry]
      responses:
        '200':
          description: Aggregated dictation productivity telemetry.
  /api/v1/account/export:
    get:
      operationId: exportAccountDataV1
      summary: Export all personal account data, transcripts, notes, templates, vocabulary, and preferences
      tags: [Account]
      responses:
        '200':
          description: Personal data export payload.
  /api/v1/account:
    delete:
      operationId: deleteAccountV1
      summary: Permanently delete the authenticated user account and purge all associated personal data
      tags: [Account]
      responses:
        '200':
          description: Account and personal data permanently purged.
components:
  schemas:
    ServiceHealthStatus:
      type: string
      enum: [Healthy, Degraded, Unhealthy]
    DatabaseConfigurationMode:
      type: string
      enum: [Configured, Unconfigured]
    HealthStatusResponseV1:
      type: object
      required:
        - status
        - service
        - contractVersion
        - environment
        - timestampUtc
        - postgresMode
      properties:
        status:
          $ref: '#/components/schemas/ServiceHealthStatus'
        service:
          type: string
        contractVersion:
          type: string
        environment:
          type: string
        timestampUtc:
          type: string
          format: date-time
        postgresMode:
          $ref: '#/components/schemas/DatabaseConfigurationMode'
    CloudTranscriptionResponseV1:
      type: object
      required: [transcript, providerId, contractVersion]
      properties:
        transcript:
          type: string
        providerId:
          type: string
        language:
          type: [string, 'null']
        contractVersion:
          type: string
    CloudTextRefineRequestV1:
      type: object
      required: [originalTranscript, outputMode]
      properties:
        originalTranscript:
          type: string
        outputMode:
          type: string
          enum: [raw, clean, professional, coding-prompt, quick-note]
    CloudTextRefineResponseV1:
      type: object
      required: [refinedText, outputMode, providerId, contractVersion]
      properties:
        refinedText:
          type: string
        outputMode:
          type: string
        providerId:
          type: string
        contractVersion:
          type: string
    TranscriptSyncRequestV1:
      type: object
      required:
        - id
        - originalTranscript
        - refinedTranscript
        - editedText
        - outputMode
        - providerId
        - durationMs
        - createdAtUtc
      properties:
        id:
          type: string
        originalTranscript:
          type: string
        refinedTranscript:
          type: string
        editedText:
          type: string
        outputMode:
          type: string
        providerId:
          type: string
        durationMs:
          type: integer
        createdAtUtc:
          type: string
          format: date-time
    TranscriptSyncResponseV1:
      type: object
      required: [syncedId, syncedAtUtc, contractVersion]
      properties:
        syncedId:
          type: string
        syncedAtUtc:
          type: string
          format: date-time
        contractVersion:
          type: string
    ApiErrorResponseV1:
      type: object
      required: [code, message, recoverable]
      properties:
        code:
          type: string
        message:
          type: string
        recoverable:
          type: boolean
