openapi: 3.1.0
info:
  title: FlowPilot API
  version: 1.0.0
  summary: Shared backend API for FlowPilot desktop and web companion clients.
  description: >
    Explicit, versioned HTTP contract for FlowPilot account synchronization,
    cloud speech transcription proxy (keeping privileged provider keys on the backend),
    cloud text refinement, and health probes.
  contact:
    name: FlowPilot Architecture Team
servers:
  - url: http://localhost:5080
    description: Local development server
tags:
  - name: Health
    description: Service health and readiness probes
  - name: Speech
    description: Cloud speech recognition and text refinement endpoints
  - name: Sync
    description: Optional user-authorized transcript synchronization
paths:
  /health:
    get:
      operationId: getHealthProbe
      tags:
        - Health
      summary: Infrastructure health probe
      description: Returns the current health status of the FlowPilot API service without requiring authentication.
      responses:
        '200':
          description: Service is healthy and ready to accept requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatusResponseV1'
  /api/v1/health:
    get:
      operationId: getHealthV1
      tags:
        - Health
      summary: Versioned v1 health and storage readiness status
      description: Returns versioned API health metadata, contract version, and storage configuration readiness.
      responses:
        '200':
          description: Versioned health response payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatusResponseV1'
  /api/v1/speech/transcribe:
    post:
      operationId: transcribeSpeechV1
      tags:
        - Speech
      summary: Transcribe captured audio via configured cloud speech provider
      description: >
        Accepts audio bytes via multipart/form-data and forwards to the server-configured
        cloud speech recognition provider without exposing privileged API keys to clients.
      responses:
        '200':
          description: Successful cloud transcription response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudTranscriptionResponseV1'
        '400':
          description: Empty or invalid audio payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseV1'
        '413':
          description: Audio payload exceeds usage/size limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseV1'
        '429':
          description: Upstream provider rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseV1'
        '503':
          description: Cloud speech provider credentials are not configured on the backend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseV1'
  /api/v1/text/refine:
    post:
      operationId: refineTextV1
      tags:
        - Speech
      summary: Refine raw transcript using cloud text refinement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudTextRefineRequestV1'
      responses:
        '200':
          description: Refined text response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudTextRefineResponseV1'
  /api/v1/transcripts/sync:
    post:
      operationId: syncTranscriptV1
      tags:
        - Sync
      summary: Synchronize a user-approved transcript entry to the cloud
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranscriptSyncRequestV1'
      responses:
        '200':
          description: Transcript synchronized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptSyncResponseV1'
components:
  schemas:
    ServiceHealthStatus:
      type: string
      enum:
        - Healthy
        - Degraded
        - Unhealthy
      description: Overall health status indicator.
    DatabaseConfigurationMode:
      type: string
      enum:
        - Configured
        - Unconfigured
      description: Indicates whether shared PostgreSQL connection settings are configured.
    HealthStatusResponseV1:
      type: object
      required:
        - status
        - service
        - contractVersion
        - environment
        - timestampUtc
        - postgresMode
      properties:
        status:
          $ref: '#/components/schemas/ServiceHealthStatus'
        service:
          type: string
          example: flowpilot-api
        contractVersion:
          type: string
          example: v1
        environment:
          type: string
          example: Development
        timestampUtc:
          type: string
          format: date-time
          example: '2026-10-21T17:30:00Z'
        postgresMode:
          $ref: '#/components/schemas/DatabaseConfigurationMode'
    CloudTranscriptionResponseV1:
      type: object
      required:
        - transcript
        - providerId
        - contractVersion
      properties:
        transcript:
          type: string
        providerId:
          type: string
          example: flowpilot-cloud-openai
        language:
          type:
            - string
            - 'null'
        contractVersion:
          type: string
          example: v1
    CloudTextRefineRequestV1:
      type: object
      required:
        - originalTranscript
        - outputMode
      properties:
        originalTranscript:
          type: string
        outputMode:
          type: string
          enum:
            - raw
            - clean
            - professional
            - coding-prompt
            - quick-note
    CloudTextRefineResponseV1:
      type: object
      required:
        - refinedText
        - outputMode
        - providerId
        - contractVersion
      properties:
        refinedText:
          type: string
        outputMode:
          type: string
        providerId:
          type: string
        contractVersion:
          type: string
    TranscriptSyncRequestV1:
      type: object
      required:
        - id
        - originalTranscript
        - refinedTranscript
        - editedText
        - outputMode
        - providerId
        - durationMs
        - createdAtUtc
      properties:
        id:
          type: string
        originalTranscript:
          type: string
        refinedTranscript:
          type: string
        editedText:
          type: string
        outputMode:
          type: string
        providerId:
          type: string
        durationMs:
          type: integer
        createdAtUtc:
          type: string
          format: date-time
    TranscriptSyncResponseV1:
      type: object
      required:
        - syncedId
        - syncedAtUtc
        - contractVersion
      properties:
        syncedId:
          type: string
        syncedAtUtc:
          type: string
          format: date-time
        contractVersion:
          type: string
    ApiErrorResponseV1:
      type: object
      required:
        - code
        - message
        - recoverable
      properties:
        code:
          type: string
        message:
          type: string
        recoverable:
          type: boolean
