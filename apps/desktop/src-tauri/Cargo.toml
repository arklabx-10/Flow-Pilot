[package]
name = "flowpilot-desktop"
version = "0.1.0"
description = "FlowPilot Windows Desktop Shell (Tauri 2 + Local SQLite Persistence)"
authors = ["FlowPilot Architecture Team"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "flowpilot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
tauri = { version = "2.3.1", features = [] }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
rusqlite = { version = "0.32.1", features = ["bundled"] }
